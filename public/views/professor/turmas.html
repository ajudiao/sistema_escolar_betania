  <script>
    const cores = [
      { bg: 'rgba(59, 130, 246, 0.1)', color: '#3b82f6', badge: 'bg-info' },
      { bg: 'rgba(16, 185, 129, 0.1)', color: '#10b981', badge: 'bg-success' },
      { bg: 'rgba(245, 158, 11, 0.1)', color: '#f59e0b', badge: 'bg-warning' },
      { bg: 'rgba(139, 92, 246, 0.1)', color: '#8b5cf6', badge: 'bg-purple' },
    ];

    async function carregarTurmas() {
      try {
        console.log('%c[Turmas] INICIANDO CARREGAMENTO', 'color: blue; font-weight: bold; font-size: 12px');
        
        const usuarioId = localStorage.getItem('userId');
        
        if (!usuarioId) {
          console.error('[Turmas] Usuário não identificado');
          document.getElementById('loadingSpinner').style.display = 'none';
          return;
        }

        // Obter professor
        console.log('[Turmas] Carregando professor...');
        const professor = await api.getProfessorByUsuario(usuarioId);
        console.log('%c[Turmas] PROFESSOR RECEBIDO', 'color: green; font-size: 12px');
        console.log('[Turmas] turmasDisciplinas:', professor.turmasDisciplinas);
        
        // Atualizar nome do professor no header
        document.querySelector('.header-user-name').textContent = professor.nome_prof;
        document.querySelector('.header-user-avatar').textContent = 
          professor.nome_prof.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

        // Extrair turmas únicas de turmasDisciplinas
        const turmasMap = new Map();
        
        console.log('%c[Turmas] Verificando turmasDisciplinas...', 'color: cyan;');
        console.log('[Turmas] professor.turmasDisciplinas exists?', !!professor.turmasDisciplinas);
        console.log('[Turmas] professor.turmasDisciplinas length:', professor.turmasDisciplinas ? professor.turmasDisciplinas.length : 0);
        
        let turmasParaCarregar = [];
        
        if (professor.turmasDisciplinas && professor.turmasDisciplinas.length > 0) {
          console.log('%c[Turmas] ✓ Encontradas turmasDisciplinas!', 'color: green;');
          
          // Extrair turmas únicas
          professor.turmasDisciplinas.forEach((td) => {
            if (td.turma && td.turma.id_turma) {
              const idTurma = td.turma.id_turma;
              
              if (!turmasMap.has(idTurma)) {
                turmasMap.set(idTurma, td.turma);
                console.log(`[Turmas] ✓ Turma ${idTurma} adicionada ao mapa`);
              }
            }
          });
          
          turmasParaCarregar = Array.from(turmasMap.values());
          console.log('%c[Turmas] ✓ Total de turmas únicas extraídas:', 'color: green;', turmasParaCarregar.length);
        } else {
          console.warn('%c[Turmas] ✗ AVISO: Nenhuma turma encontrada em turmasDisciplinas!', 'color: orange;');
          console.log('[Turmas] Tentando fallback para api.getTurmasProfessor...');
          
          // Fallback: usar método antigo
          try {
            turmasParaCarregar = await api.getTurmasProfessor(professor.id_prof);
            console.log('[Turmas] ✓ Turmas carregadas via fallback:', turmasParaCarregar.length);
          } catch (errFallback) {
            console.error('[Turmas] Fallback também falhou:', errFallback);
            throw errFallback;
          }
        }

        if (turmasParaCarregar.length === 0) {
          console.warn('%c[Turmas] AVISO: Nenhuma turma encontrada!', 'color: orange;');
          document.getElementById('loadingSpinner').innerHTML = `
            <div class="alert alert-info mt-3">
              <strong>Nenhuma turma atribuída</strong>
              <p>Você não tem turmas atribuídas no momento.</p>
            </div>
          `;
          return;
        }

        // Carregar dados detalhados das turmas (estudantes, etc.)
        console.log('[Turmas] Carregando detalhes das turmas...');
        const turmasDetalhadas = await Promise.all(
          turmasParaCarregar.map(turma => api.getTurma(turma.id_turma))
        );
        
        console.log('%c[Turmas] ✓ DETALHES CARREGADOS', 'color: green; font-size: 12px');

        // Renderizar turmas
        renderizarTurmas(turmasDetalhadas);

        // Esconder spinner e mostrar turmas
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('turmasContainer').style.display = '';
        
        console.log('%c[Turmas] CARREGAMENTO COMPLETO COM SUCESSO', 'color: green; font-weight: bold; font-size: 12px');

      } catch (error) {
        console.error('%c[Turmas] ERRO CRÍTICO:', 'color: red; font-weight: bold; font-size: 12px', error);
        document.getElementById('loadingSpinner').innerHTML = `
          <div class="alert alert-danger mt-3">
            <strong>Erro ao carregar turmas!</strong>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    function renderizarTurmas(turmas) {
      const container = document.getElementById('turmasContainer');
      container.innerHTML = '';

      turmas.forEach((turma, index) => {
        const cor = cores[index % cores.length];
        const totalAlunos = turma._count?.estudantes || 0;

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="card turma-card">
            <div class="turma-card-header">
              <div class="turma-icon" style="background: ${cor.bg}; color: ${cor.color};">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </div>
              <div style="flex: 1;">
                <h5 class="turma-title">${turma.sigla_turma}</h5>
                <p class="turma-discipline">${turma.classe_turma}ª Classe</p>
              </div>
              <span class="badge ${cor.badge}" style="height: fit-content;">${turma.turno_turma}</span>
            </div>
            <div class="turma-stats">
              <div class="turma-stat">
                <span class="turma-stat-value">${totalAlunos}</span>
                <span class="turma-stat-label">Alunos</span>
              </div>
              <div class="turma-stat">
                <span class="turma-stat-value">${turma.classe?.sigla_classe || 'N/A'}</span>
                <span class="turma-stat-label">Curso</span>
              </div>
              <div class="turma-stat">
                <span class="turma-stat-value">${turma.sala_turma || 'N/A'}</span>
                <span class="turma-stat-label">Sala</span>
              </div>
            </div>
            <div class="turma-actions">
              <a href="faltas.html?turma=${turma.id_turma}" class="btn btn-sm btn-outline-secondary">Faltas</a>
              <a href="turma-detalhes.html?id=${turma.id_turma}" class="btn btn-sm btn-primary">Ver Detalhes</a>
            </div>
          </div>
        `;

        container.appendChild(col);
      });
    }

    document.addEventListener('DOMContentLoaded', carregarTurmas);
  </script>
